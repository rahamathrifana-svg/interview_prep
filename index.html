<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placement Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2fb;--card:#fff;--ink:#0f1c3f;--mut:#5a6685;--navy:#14275e;--line:#14275e;--blue:#4c7dff;--green:#2fbf71;--yel:#ffc83d;--red:#ff5d6c;--pk:#f3e8ff;--bl:#e3edff;--gr:#dcf7e8;--ye:#fff3cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1330;--card:#14204a;--ink:#eef2ff;--mut:#a5b1d6;--line:#6f8cff;--bl:#1d2f6b;--gr:#14402c;--ye:#4a3e12;--pk:#2e2255}}
:root[data-theme=dark]{--bg:#0b1330;--card:#14204a;--ink:#eef2ff;--mut:#a5b1d6;--line:#6f8cff;--bl:#1d2f6b;--gr:#14402c;--ye:#4a3e12;--pk:#2e2255}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;margin:0 0 .4em;letter-spacing:.3px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:auto;padding:12px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;border-radius:0 0 18px 18px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lv{background:var(--yel);color:#14275e;font-family:'Lilita One';border-radius:12px;padding:4px 12px;font-size:20px;box-shadow:0 3px 0 #b88a00}
.xpb{flex:1;min-width:140px;height:16px;background:#ffffff30;border-radius:9px;overflow:hidden}.xpb i{display:block;height:100%;background:var(--green);transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.hud small{opacity:.85}.hud button{background:none;border:2px solid #fff6;color:#fff;border-radius:10px;padding:2px 8px;cursor:pointer}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 2px}
nav button{white-space:nowrap;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .1s,box-shadow .1s}
nav button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
nav button.on{background:var(--blue);color:#fff}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 5px 0 var(--line)}
.btn{background:var(--green);color:#06301a;border:3px solid var(--line);border-radius:12px;padding:7px 14px;cursor:pointer;box-shadow:0 4px 0 var(--line);font-weight:800}
.btn.alt{background:var(--yel);color:#14275e}.btn.bad{background:var(--red);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;background:var(--bl);border:2px solid transparent}
.cal .h{aspect-ratio:auto;background:none;color:var(--mut);font-size:12px}
.cal .done{background:var(--gr)}.cal .today{border-color:var(--blue);background:var(--bl);animation:pulse 1.6s infinite}
.cal .pend{background:var(--ye)}.cal .miss{background:var(--pk)}.cal .lock{opacity:.55}
@keyframes pulse{50%{box-shadow:0 0 0 6px #4c7dff40}}
.node{border:3px solid var(--line);border-radius:16px;padding:10px;background:var(--card);cursor:pointer;text-align:left;box-shadow:0 4px 0 var(--line);position:relative}
.node.lock{opacity:.5;cursor:not-allowed}.node.done{background:var(--gr)}
.auth-screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef2fb 0%,#dce8ff 100%);color:#0f1c3f}
.auth-screen[hidden]{display:none}.auth-card{width:min(430px,100%);background:#fff;border:3px solid #14275e;border-radius:24px;padding:30px;box-shadow:0 8px 0 #14275e;text-align:center}
.auth-logo{width:72px;height:72px;border-radius:18px;background:#14275e;color:#ffc83d;display:grid;place-items:center;font:400 34px 'Lilita One';margin:0 auto 16px;transform:rotate(-4deg)}
.auth-card h1{font-size:38px;margin-bottom:8px}.auth-card>p{color:#5a6685;margin:0 0 22px}
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1f1f1f;border:2px solid #14275e;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #14275e}
.google-btn:hover{background:#f8faff}.google-btn svg{width:22px;height:22px}
.auth-error{min-height:24px;color:#b42318;margin-top:14px;font-size:14px}
.auth-user{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.auth-loading{position:fixed;inset:0;z-index:19;display:grid;place-items:center;background:var(--bg)}
.bar{height:12px;background:var(--bl);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);transition:width .5s}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:13px;background:var(--bl)}
input,select,textarea{width:100%;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:7px;margin:3px 0 8px}
label.ck{display:flex;gap:8px;align-items:center;margin:4px 0}label.ck input{width:20px;height:20px;margin:0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card);border:3px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}
.opt.ok{background:var(--gr)}.opt.no{background:var(--pk)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;border:3px solid var(--yel);animation:pop .4s cubic-bezier(.2,1.6,.4,1);z-index:9;max-width:92vw}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
a{color:var(--blue)}.mut{color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<div class="auth-loading" id="authLoading">Loading Placement Quest...</div>
<section class="auth-screen" id="authScreen" hidden>
 <div class="auth-card">
  <div class="auth-logo">PQ</div>
  <h1>Placement Quest</h1>
  <p>Sign in to sync your learning quest across devices.</p>
  <button class="google-btn" id="googleLogin" type="button">
   <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.2c0-.64-.06-1.26-.16-1.85H12v3.51h5.24a4.48 4.48 0 0 1-1.94 2.94v2.4h3.15c1.84-1.69 2.9-4.18 2.9-7Z"/><path fill="#34A853" d="M12 21.75c2.62 0 4.82-.87 6.43-2.35l-3.15-2.4c-.87.58-1.98.93-3.28.93-2.52 0-4.66-1.7-5.42-3.99H3.33v2.47A9.4 9.4 0 0 0 12 21.75Z"/><path fill="#FBBC05" d="M6.58 13.94A5.65 5.65 0 0 1 6.28 12c0-.67.11-1.33.3-1.94V7.59H3.33A9.4 9.4 0 0 0 2.62 12c0 1.59.38 3.09 1.05 4.41l2.91-2.47Z"/><path fill="#EA4335" d="M12 6.07c1.43 0 2.7.49 3.71 1.45l2.79-2.79A9.04 9.04 0 0 0 12 2.25a9.4 9.4 0 0 0-8.67 5.34l3.25 2.47A5.72 5.72 0 0 1 12 6.07Z"/></svg>
   Continue with Google
  </button>
  <div class="auth-error" id="authError" role="alert"></div>
 </div>
</section>
<div id="appShell" hidden>
<div class="hud"><span class="lv" id="lv">LV 1</span><div style="flex:1;min-width:150px"><div class="xpb"><i id="xpf" style="width:0"></i></div><small id="xpt"></small></div><span id="stk">🔥 0</span><button id="authUser" class="auth-user" type="button" title="Sign out">Account</button><button id="th" aria-label="Toggle theme">◐</button></div>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
</div>
<script>
const $=s=>document.querySelector(s);
const K='pq_v1';
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({xp:0,start:null,checkins:[],lr:{},quiz:{},sun:{},certs:[],marks:[],li:{},proj:{},theme:null},S||{});
let progressSaveTimer=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage is full. Remove a PDF or use a certificate link instead.')}queueProgressSave()};
async function queueProgressSave(){
 if(!window.firebaseAuthUser)return;
 clearTimeout(progressSaveTimer);
 progressSaveTimer=setTimeout(async()=>{
  try{
   const {error}=await supabaseClient.from('user_progress').upsert({
    user_id:window.firebaseAuthUser.uid,
    email:window.firebaseAuthUser.email||'',
    display_name:window.firebaseAuthUser.displayName||'',
    photo_url:window.firebaseAuthUser.photoURL||'',
    xp:S.xp||0,
    progress:JSON.parse(JSON.stringify(S)),
    updated_at:new Date().toISOString()
   },{onConflict:'user_id'});
   if(error)throw error;
  }catch(e){console.error('Unable to save progress to Supabase',e)}
 },400);
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ds(d)};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function xp(n,m){const o=Math.floor(S.xp/100);S.xp+=n;save();hud();toast('+'+n+' XP '+(m||''));if(Math.floor(S.xp/100)>o)setTimeout(()=>toast('⭐ LEVEL UP! You reached level '+(Math.floor(S.xp/100)+1)),900)}
function streak(){let c=0,d=today();if(!S.checkins.includes(d))d=addD(d,-1);while(S.checkins.includes(d)){c++;d=addD(d,-1)}return c}
function hud(){$('#lv').textContent='LV '+(Math.floor(S.xp/100)+1);$('#xpf').style.width=(S.xp%100)+'%';$('#xpt').textContent=(S.xp%100)+' / 100 XP';$('#stk').textContent='🔥 '+streak()+' day streak'}
const TOP=['Number Series','Alphabet Series','Coding and Decoding','Analogy','Classification','Blood Relations','Sunday Test 1','Direction Sense','Ranking and Ordering','Seating Arrangement','Circular Arrangement','Syllogism','Venn Diagrams','Sunday Test 2','Statement and Conclusion','Statement and Assumption','Statement and Argument','Data Sufficiency','Logical Puzzles','Input and Output','Sunday Test 3','Calendar Reasoning','Clock Reasoning','Non-Verbal Reasoning','Mirror and Water Images','Paper Folding and Cutting','Cubes and Dice','Sunday Test 4','Mixed Reasoning','Full Mock Test'];
const LEARN={0:{t:'A number series follows a hidden rule. Find the rule from the gaps between terms, then apply it to the next term.',tips:['Check differences (+, −).','Check multiples (×2, ×3).','Check squares, cubes and alternating patterns.'],q:[['Next: 2, 4, 6, 8, ?',['9','10','12','14'],1,'Add 2 each time.'],['Next: 3, 6, 12, 24, ?',['36','42','48','30'],2,'Multiply by 2.'],['Next: 1, 4, 9, 16, ?',['20','25','36','24'],1,'Squares of 1,2,3,4,5.'],['Next: 5, 6, 8, 11, 15, ?',['18','19','20','21'],2,'Differences grow +1,+2,+3,+4,+5.'],['Next: 2, 3, 5, 9, 17, ?',['25','31','33','35'],2,'Differences 1,2,4,8,16 → 17+16=33.']]},
1:{t:'Alphabet series use letter positions (A=1 … Z=26). Look at the jump between letters.',tips:['Write positions: A1 B2 … Z26.','Check forward and backward jumps.','Opposite letter pairs sum to 27.'],q:[['Next: A, C, E, G, ?',['H','I','J','K'],1,'Skip one letter each time.'],['Next: Z, X, V, T, ?',['S','R','Q','P'],1,'Go back by 2.'],['Opposite of D (position from the end)?',['W','V','X','U'],0,'D=4, 27−4=23 → W.'],['Next: B, E, H, K, ?',['L','M','N','O'],2,'Jump of 3.'],['Next: AZ, BY, CX, ?',['DW','DV','EW','CW'],0,'First +1, second −1.']]}};
function curDay(){return S.start?Math.min(30,Math.floor((new Date(today())-new Date(S.start))/864e5)+1):0}
function status(d){const dt=addD(S.start,d-1),t=today();if(dt>t)return'lock';if(S.lr[d]?.done)return'done';if(dt===t)return S.checkins.includes(t)?'pend':'today';return'miss'}
let tab='home',openDay=0,qs=null,calM=new Date();
const TABS=[['home','🏠 Home'],['ap','➗ Aptitude'],['lr','🧠 Reasoning'],['ss','🗣 Soft Skills'],['cert','🎓 Certs'],['proj','🛠 Project']];
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;openDay=0;sOpen=0;apOpen=0;pOpen=null;pOpen=-1;nav();render()}}}
function render(){({home,ap,lr,ss,cert,proj})[tab]()}
function home(){
 const t=today(),ci=S.checkins.includes(t),A=S.ap&&S.ap.start?S.ap:null,cn=S.start?curDay():0,acts=[];
 if(!S.start)acts.push([`Start the 30-day Reasoning and Soft Skills challenge`,'Start','st']);
 else if(!ci)acts.push([`Check in to unlock today's Reasoning and Soft Skills tasks`,'Check In Today','ci']);
 else if(cn>=1&&cn<=30){if(!S.lr[cn]?.done)acts.push([`Reasoning · Day ${cn}: ${TOP[cn-1]}`,'Open','lr']);if(!(S.ss&&S.ss[cn]?.done))acts.push([`Soft Skills · Day ${cn}: ${SK[cn-1]}`,'Open','ss'])}
 if(!A)acts.push([`Start the 30-day Aptitude challenge`,'Start','ap']);
 else{const n=apN(t);if(n>=1&&n<=30&&!A.d[n]?.done)acts.push([`Aptitude · Day ${n}: ${APS[n-1]}${A.ci.includes(t)?'':' (check in first)'}`,'Open','ap'])}
 const ip=S.certs.filter(c=>c.steps&&c.steps.some(Boolean)&&!c.steps[4]).length;if(ip)acts.push([`${ip} certification${ip>1?'s':''} in progress`,'Open','cert']);
 const pd=PS.filter((_,i)=>S.proj[i]?.s==='Completed').length,cd=S.certs.filter(c=>c.steps?.[4]).length;
 const aks=(()=>{if(!A)return 0;let c=0,d=A.ci.includes(t)?t:addD(t,-1);while(A.ci.includes(d)){c++;d=addD(d,-1)}return c})();
 $('#main').innerHTML=`<div class='card'><h1>Your tracking page</h1><p class='mut'>Everything you need to do today, in one place.</p></div><div class='grid'><div class='card'><h3>🔥 Check-in streak</h3><b>${streak()} days</b></div><div class='card'><h3>🔥 Aptitude streak</h3><b>${aks} days</b></div><div class='card'><h3>🎓 Certifications done</h3><b>${cd}</b> of ${S.certs.length}</div><div class='card'><h3>🛠 Project steps completed</h3><b>${pd}</b> of 20</div><div class='card'><h3>🚀 Projects live</h3><b>${(S.pl||[]).filter(x=>x.live).length}</b> of ${(S.pl||[]).length}</div></div><div class='card'><h2>Project tracker</h2><div class='bar'><i style='width:${pd*5}%'></i></div><p class='mut'>${pd}/20 steps completed</p>${(S.pl||[]).length?(S.pl).map(x=>`<div class='row' style='justify-content:space-between;margin:8px 0'><span><b>${esc(x.name)}</b> <span class='pill'>${x.live?'✅ Live':'🛠 In progress'}</span></span>${x.live?`<a class='btn alt' href='${esc(x.live)}' target='_blank' rel='noopener noreferrer' style='text-decoration:none'>Open live</a>`:`<button class='btn' data-go='proj'>Add live link</button>`}</div>`).join(''):`<p class='mut'>No projects yet. Add one in the Project tab.</p>`}<button class='btn alt' data-go='proj'>Open Project tab</button></div><div class='card'><h2>Action required today</h2>${acts.length?acts.map(a=>`<div class='row' style='justify-content:space-between;margin:8px 0'><span>${esc(a[0])}</span><button class='btn' data-go='${a[2]}'>${a[1]}</button></div>`).join(''):'<p>🎉 All done for today. Nice work!</p>'}</div><div class='grid'>${TABS.filter(x=>x[0]!=='home').map(x=>`<button class='node' data-go='${x[0]}'><b>${x[1]}</b></button>`).join('')}</div>`;
 $('#main').onclick=e=>{const b=e.target.closest('[data-go]');if(!b)return;const g=b.dataset.go;
  if(g==='ci'){if(!S.checkins.includes(t)){S.checkins.push(t);save();xp(10);toast(`Today's tasks unlocked!`)}return home()}
  if(g==='st'){S.start=t;save();toast('Challenge started! Day 1 is open.');return home()}
  tab=g;nav();render()}}
function homeOld(){
 const t=today(),ci=S.checkins.includes(t),y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let cells=['S','M','T','W','T','F','S'].map(d=>`<div class="h">${d}</div>`).join('')+'<div class="h"></div>'.repeat(first);
 for(let i=1;i<=n;i++){const d=ds(new Date(y,m,i));let c='lock',ic='🔒';
  if(d===t){c=ci?'pend':'today';ic=ci?'🟡':'🔓'}else if(d<t){c=S.checkins.includes(d)?'done':'miss';ic=S.checkins.includes(d)?'✅':'•'}
  const day=S.start?Math.floor((new Date(d)-new Date(S.start))/864e5)+1:0;if(day>=1&&day<=30&&S.lr[day]?.done)c='done',ic='✅';
  cells+=`<div class="${c}"><b>${i}</b><span>${ic}</span></div>`}
 const done=Object.values(S.lr).filter(x=>x.done).length;
 $('#main').innerHTML=`<div class="card"><h1>Welcome back, player!</h1><p class="mut">Check in each day to unlock the quest. Earn XP, keep your streak alive, level up.</p>
 <div class="row"><button class="btn" id="ci" ${ci?'disabled':''}>${ci?'✔ Checked in today':'⚔ Check In Today'}</button>${!S.start?'<button class="btn alt" id="st">Start 30-Day Challenge</button>':'<span class="pill">Challenge Day '+curDay()+' / 30</span>'}</div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><button class="btn alt" id="pm">◀</button><h2 style="margin:0">${calM.toLocaleString('default',{month:'long'})} ${y}</h2><button class="btn alt" id="nm">▶</button></div><br><div class="cal">${cells}</div>
 <p class="mut" style="font-size:14px">✅ done · 🔓 today · 🟡 checked in, pending · 🔒 future · • missed (still open)</p></div>
 <div class="grid"><div class="card"><h3>Check-ins</h3>${S.checkins.length}</div><div class="card"><h3>Topics done</h3>${done} / 30</div><div class="card"><h3>Streak</h3>${streak()}</div><div class="card"><h3>Certs done</h3>${S.certs.filter(c=>c.status==='Completed').length}</div></div>`;
 $('#ci').onclick=()=>{if(S.checkins.includes(today()))return;S.checkins.push(today());save();xp(10,'· Today\'s Task Unlocked!');home()};
 const s=$('#st');if(s)s.onclick=()=>{S.start=today();save();toast('Challenge started! Day 1 is open.');home()};
 $('#pm').onclick=()=>{calM=new Date(y,m-1,1);home()};$('#nm').onclick=()=>{calM=new Date(y,m+1,1);home()}}
function lr(){
 if(!S.start){$('#main').innerHTML='<div class="card"><h2>Logical Reasoning Quest</h2><p>Start the 30-day challenge from Home to unlock Day 1.</p></div>';return}
 if(openDay)return day();
 const wk=['Basic Reasoning','Arrangement & Relationships','Critical & Analytical','Non-Verbal & Visual','Final Prep'];
 let h='<h2>Logical Reasoning · 30 Levels</h2>';
 wk.forEach((w,i)=>{h+=`<h3>Week ${i+1} · ${w}</h3><div class="grid">`;for(let d=i*7+1;d<=Math.min(30,i*7+7);d++){const st=status(d);if(d===29&&i===4)h+='';
  h+=`<button class="node ${st==='lock'?'lock':st==='done'?'done':''}" data-d="${d}"><b>Day ${d}</b><br>${esc(TOP[d-1])}<br><span class="pill">${{lock:'🔒 Locked',done:'✅ Done',pend:'🟡 Open',today:'🔓 Check in first',miss:'🔴 Missed · open'}[st]}</span></button>`}h+='</div>'});
 $('#main').innerHTML=h;
 $('#main').onclick=e=>{const b=e.target.closest('.node');if(!b)return;const d=+b.dataset.d,st=status(d);
  if(st==='lock')return toast('🔒 This level unlocks on its scheduled date.');
  if(st==='today')return toast('Check in on Home to unlock today\'s task.');
  openDay=d;qs=null;lr()}}
function day(){
 const d=openDay,L=LEARN[d-1],R=S.lr[d]=S.lr[d]||{c:[0,0,0,0,0]},items=['Learned the concept','Understood rules and patterns','Practiced 20 questions','Completed the 5-question quiz','Revised incorrect answers'];
 const qz=S.quiz[d];
 let h=`<button class="btn alt" id="bk">◀ Map</button><div class="card"><h2>Day ${d} · ${esc(TOP[d-1])}</h2>`;
 if(L)h+=`<p>${esc(L.t)}</p><ul>${L.tips.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul>`;else h+='<p class="mut">Lesson content for this topic is not written yet in this build. You can still tick off your own study using the checklist.</p>';
 h+='</div>';
 if(L){h+=`<div class="card"><h3>Daily Quiz</h3>`;

const NT={'Number System':['A number system classifies numbers by their properties: natural (1, 2, 3), whole (0, 1, 2), integers (-2, 0, 5), even, odd, prime (exactly two factors) and composite (more than two factors).',['Divisible by 3: digit sum divisible by 3','Divisible by 4: last two digits divisible by 4','Divisible by 6: divisible by both 2 and 3','Divisible by 8: last three digits divisible by 8','Divisible by 9: digit sum divisible by 9','Divisible by 11: alternating digit sums differ by 0 or a multiple of 11'],'Is 729 divisible by 9? 7 + 2 + 9 = 18, which is divisible by 9. Yes.'],'Simplification':['Solve expressions with BODMAS: Brackets, Orders, Division, Multiplication, Addition, Subtraction. Division and multiplication have equal priority, and so do addition and subtraction. Work left to right.',['BODMAS order'],'25 + 5 × 4 − 10: multiply 5 × 4 = 20, add 25 + 20 = 45, subtract 45 − 10 = 35.'],'HCF and LCM':['HCF is the largest number that divides all the given numbers. LCM is the smallest common multiple.',['HCF × LCM = product of the two numbers'],'12 and 18: common factors 1, 2, 3, 6 so HCF = 6. Multiples of 12: 12, 24, 36. Of 18: 18, 36. LCM = 36.'],'Fractions and Decimals':['A fraction shows a part of a whole; a decimal uses a decimal point. Fractions can be proper (2/5), improper (7/4) or mixed (1 3/4).',['1/2 = 0.5 = 50%','1/4 = 0.25 = 25%','1/5 = 0.2 = 20%','1/8 = 0.125 = 12.5%','3/4 = 0.75 = 75%','a/b ÷ c/d = a/b × d/c'],'2/3 × 3/4 = 1/2. 2/3 ÷ 4/5 = 2/3 × 5/4 = 5/6.'],'Ratio and Proportion':['A ratio compares two quantities. A proportion says two ratios are equal.',['a:b = c:d means a × d = b × c','Share = individual ratio ÷ total ratio × total'],'Divide ₹600 in the ratio 2:4. Total parts = 6. Shares: 600 × 2/6 = ₹200 and 600 × 4/6 = ₹400.'],'Average':['Average is the sum of the values divided by how many values there are.',['Average = Sum ÷ Number of values','Sum = Average × Number'],'Average of 10, 20, 30, 40, 50: sum 150 ÷ 5 = 30.'],'Profit and Loss':['CP is cost price and SP is selling price. Compare them to find profit or loss.',['Profit = SP − CP','Loss = CP − SP','Profit % = Profit ÷ CP × 100','Loss % = Loss ÷ CP × 100'],'CP ₹500, SP ₹600: profit ₹100, profit % = 100/500 × 100 = 20%.'],'Discount':['Discount is the reduction given on the marked price (MP).',['Discount = MP − SP','Discount % = Discount ÷ MP × 100','SP = MP × (100 − D) ÷ 100'],'MP ₹1,000 with 20% discount: discount ₹200, SP ₹800.'],'Compound Interest':['Compound interest is worked out on the principal plus the interest already earned.',['A = P(1 + R/100)^T','CI = A − P','SI uses the original principal only; CI is usually higher'],'P ₹1,000, R 10%, T 2 years: year 1 interest ₹100 (₹1,100), year 2 interest ₹110 (₹1,210). CI = ₹210.'],'Problems on Ages':['Age problems compare present, past and future ages.',['After n years: present age + n','Before n years: present age − n','The age difference stays constant'],'Father 40, son 10. After 5 years they are 45 and 15, a ratio of 3:1.'],'Partnership':['Partners share profit in proportion to capital × time.',['Profit ratio = Capital × Time'],'A: 10,000 × 12 = 1,20,000. B: 20,000 × 6 = 1,20,000. Ratio 1:1, so a ₹10,000 profit is split ₹5,000 each.'],'Mixtures and Alligation':['Alligation finds the ratio in which two items of different price or strength are mixed.',['Cheaper : Dearer = (Dearer − Mean) : (Mean − Cheaper)'],'Rice at ₹20/kg and ₹40/kg mixed to get ₹30/kg: (40 − 30) : (30 − 20) = 1:1.'],'Time and Work':['If a job takes n days, one day of work is 1/n of the job.',['One day work = 1 ÷ Total days','Together time = (A × B) ÷ (A + B)'],'A takes 10 days, B takes 20. Together: 1/10 + 1/20 = 3/20 per day, so 20/3 = 6 2/3 days.'],'Pipes and Cisterns':['Inlet pipes fill (positive work). Outlet pipes empty (negative work).',['Net work = filling rate − emptying rate'],'A fills in 4 hours, B empties in 12 hours: 1/4 − 1/12 = 1/6 per hour, so 6 hours.'],'Time, Speed and Distance':['Speed, distance and time are linked by three formulas.',['Speed = Distance ÷ Time','Distance = Speed × Time','Time = Distance ÷ Speed','km/hr to m/s: × 5/18','m/s to km/hr: × 18/5'],'120 km in 2 hours: speed = 60 km/hr.'],'Problems on Trains':['Find the time a train takes to cross a pole, a platform or another train.',['Crossing a pole: Time = Train length ÷ Speed','Crossing a platform: Time = (Train + Platform length) ÷ Speed'],'A 100 m train at 20 m/s crosses a pole in 100/20 = 5 seconds.'],'Boats and Streams':['Downstream means with the current. Upstream means against it.',['Downstream = Boat + Stream','Upstream = Boat − Stream','Boat speed = (Downstream + Upstream) ÷ 2','Stream speed = (Downstream − Upstream) ÷ 2'],'Boat 10 km/hr, stream 2 km/hr: downstream 12 km/hr, upstream 8 km/hr.'],'Problems on Clocks':['Find the angle between the hour hand and the minute hand.',['Angle = |30H − 5.5M|','If the result exceeds 180°, subtract it from 360°'],'At 3:00: |30 × 3 − 5.5 × 0| = 90°.'],'Problems on Calendars':['Calendar questions find the day of the week for a date.',['Normal year: 365 days = 52 weeks + 1 day','Leap year: 366 days = 52 weeks + 2 days','Leap year: divisible by 400, or by 4 but not by 100'],'2024 is a leap year. 1900 is not. 2000 is.'],'Probability':['Probability measures how likely an event is.',['P(E) = Favourable outcomes ÷ Total outcomes','Impossible event = 0, certain event = 1'],'One coin toss: P(Head) = 1/2.'],'Permutation and Combination':['Permutation counts arrangements (order matters). Combination counts selections (order does not matter).',['nPr = n! ÷ (n − r)!','nCr = n! ÷ (r! (n − r)!)','5! = 120'],'3P2 = 3!/1! = 6. 3C2 = 3!/(2! 1!) = 3.'],'Algebra':['Algebra uses letters to stand for unknown numbers.',['(a + b)² = a² + 2ab + b²','(a − b)² = a² − 2ab + b²','a² − b² = (a − b)(a + b)'],'x + 5 = 12 gives x = 12 − 5 = 7.'],'Geometry and Mensuration':['Geometry studies shapes. Mensuration finds their area, perimeter and volume.',['Square: area a², perimeter let plE=null;
function projLinks(){
 S.pl=S.pl||[];let c=$('#pl');if(!c){c=document.createElement('div');c.id='pl';$('#main').children[0].after(c)}

function proj(){return pOpen!==null?projStep():projList()}
function projStep(){
 const i=pOpen,p=PS[i],g=PG[i],R=S.proj[i]=S.proj[i]||{s:'Not Started'},ST=g[1].split('|'),ck=R.g=R.g||[];
 let h=`<button class='btn alt' id='pb'>◀ All steps</button><div class='card'><h2>Step ${i+1} · ${esc(p[0])}</h2><span class='pill'>${p[1]}</span> <span class='pill'>${ck.filter(Boolean).length}/${ST.length} tasks</span><p>${esc(g[0])}</p></div>`;
 h+=`<div class='card'><h3>Step-by-step learning</h3>${ST.map((s,k)=>`<label class='ck'><input type='checkbox' data-k='${k}' ${ck[k]?'checked':''}>${k+1}. ${esc(s)}</label>`).join('')}</div>`;
 h+=`<div class='card'><h3>What to learn</h3><p>${esc(g[2])}</p><h3>Practice activity</h3><p>${esc(g[3])}</p><h3>Completion task</h3><p>${esc(g[4])}</p><h3>Final output</h3><p><b>${esc(g[5])}</b></p>${g[6]?`<h3>Example</h3><pre style='overflow-x:auto;white-space:pre-wrap;background:var(--bl);padding:10px;border-radius:10px'>${esc(g[6])}</pre>`:''}</div>`;
 h+=`<div class='row'>${i>0?`<button class='btn alt' id='pp'>◀ Previous</button>`:''}<button class='btn' id='pd' ${R.s==='Completed'?'disabled':''}>${R.s==='Completed'?'Completed ✅':'Mark as Completed'}</button>${i<19?`<button class='btn alt' id='pn'>Next ▶</button>`:''}</div>`;
 $('#main').innerHTML=h;
 $('#main').onchange=e=>{const k=e.target.dataset.k;if(k!=null){ck[k]=e.target.checked?1:0;if(R.s==='Not Started')R.s='In Progress';save()}};
 $('#main').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m={pb:()=>{pOpen=null},pp:()=>{pOpen=i-1},pn:()=>{pOpen=i+1},pd:()=>{R.s='Completed';R.d=R.d||today();save();xp(20,'· Step cleared!')}}[b.id];if(m){m();proj();scrollTo(0,0)}}}
function projList(){
 
 const n=PS.filter((_,i)=>S.proj[i]?.s==='Completed').length,pct=n*5;
 $('#main').innerHTML=`<div class="card"><h2>Project Quest · 20 Steps</h2><p class="mut">Build your Student Task Manager step by step.</p><div class="bar"><i style="width:${pct}%"></i></div><p><b>${n}/20</b> steps · ${pct}%</p>${pct===100?'<p><b>🏆 Congratulations! You have completed all 20 steps. Your project is ready for your portfolio and placement interviews.</b></p>':''}<button class="btn bad" id="rs">Reset Progress</button></div><div class="grid">`+PS.map((p,i)=>{const r=S.proj[i]||{s:'Not Started'};return`<div class="card ${r.s==='Completed'?'':''}" style="${r.s==='Completed'?'background:var(--gr)':''}"><b>Step ${i+1}</b> <span class="pill">${p[1]}</span><br>${esc(p[0])}<br><button class="btn alt" data-g="${i}">Open guide</button><select data-s="${i}">${['Not Started','In Progress','Completed'].map(s=>`<option ${r.s===s?'selected':''}>${s}</option>`).join('')}</select><input type="date" data-d="${i}" value="${esc(r.d||'')}" aria-label="Completion date"><input data-n="${i}" placeholder="Notes" value="${esc(r.n||'')}"><p class="mut" style="margin:6px 0 0;font-size:14px">Output: ${esc(PG[i][5])}</p></div>`}).join('')+'</div>';
 $('#main').onchange=e=>{const t=e.target.dataset,r=S.proj[+(t.s??t.d??t.n)]=S.proj[+(t.s??t.d??t.n)]||{s:'Not Started'};
  if(t.s!=null){const was=r.s;r.s=e.target.value;if(r.s==='Completed'&&was!=='Completed'){r.d=r.d||today();save();xp(20,'· Step cleared!')}else save();proj()}
  if(t.d!=null){r.d=e.target.value;save()}if(t.n!=null){r.n=e.target.value;save()}};
 projLinks();$('#main').onclick=e=>{const b=e.target.closest('[data-g]');if(b){pOpen=+b.dataset.g;proj();scrollTo(0,0)}};
 $('#rs').onclick=()=>{ask('Reset all project progress?',()=>{S.proj={};save();proj()})}
